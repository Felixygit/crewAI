screen_task:
  description: >
    Run the small_cap_rvol_screener tool with max_price={max_price},
    min_rvol={min_rvol}, min_atr_pct={min_atr_pct}, and only_passed=true.
    Summarize each passed symbol with last price, RVOL, ATR%, dollar volume,
    and spread. If none pass, say so clearly.
  expected_output: >
    A short markdown list of passed tickers with key metrics from the screener.
  agent: market_screener

plan_task:
  description: >
    For each screened ticker from the previous task, call
    rvol_breakout_trade_plan with symbol, account_equity={account_equity},
    and risk_per_trade_pct={risk_per_trade_pct}. Capture entry, stop, targets,
    shares, and any skip_reason. Do not invent prices — use tool output only.
  expected_output: >
    A markdown table of trade plans including side, entry, stop, T1, T2,
    shares, and skip reasons where applicable.
  agent: breakout_strategist

risk_review_task:
  description: >
    Review the trade plans. Keep only actionable LONG plans. Rank them by
    setup quality (RVOL strength, stop tightness, clean VWAP hold). Produce a
    final morning brief with:
    1) ranked actionable trades
    2) rejected / waiting names with reasons
    3) risk reminders (max hold, scale-out, invalidation)
    Reminder: this is educational research output, not personalized financial advice.
  expected_output: >
    A final markdown morning brief ready to paste into a trading journal.
  agent: risk_officer
  output_file: output/morning_brief.md
