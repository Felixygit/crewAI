[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatile-bot"
version = "0.1.0"
description = "High-volatility Connors RSI(2) + NATR + IBS mean-reversion trading bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
volatile-bot = "volatile_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
